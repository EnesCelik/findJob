title_filter:
  positive:
    - "QA"
    - "Quality Assurance"
    - "Test Automation"
    - "Automation Engineer"
    - "QA Automation"
    - "Software Test"
    - "SDET"
    - "Quality Engineer"
    - "Test Engineer"
    - "Senior QA"
    - "Senior Test Engineer"
    - "Senior Automation Engineer"
  negative:
    - "Junior"
    - "Intern"
    - "Mobile Developer"
    - "Frontend Developer"
    - "Backend Developer"
    - "Embedded"
    - "Firmware"
    - "SAP"
    - "Sales"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"

location_filter:
  require_remote_elsewhere_in_country: false
  country_keywords:
    - "Turkey"
    - "Türkiye"
  remote_keywords:
    - "Remote"
    - "Fully Remote"
    - "Remote First"
    - "Home Office"
  office_cities:
    - "Ankara"
  always_allow:
    - "Turkey"
    - "Türkiye"
    - "Ankara"
    - "Istanbul"
    - "İstanbul"
    - "Germany"
    - "Netherlands"
    - "United Kingdom"
    - "Ireland"
    - "Sweden"
    - "Denmark"
  allow:
    - "Remote"
    - "Fully Remote"
    - "Remote First"
    - "Relocation"
    - "Visa"
    - "Sponsorship"
    - "Turkey"
    - "Türkiye"
    - "Ankara"
    - "Istanbul"
    - "İstanbul"
    - "Germany"
    - "Netherlands"
    - "United Kingdom"
    - "Ireland"
    - "Sweden"
    - "Denmark"
    - "Poland"
    - "Romania"
    - "Portugal"
    - "Spain"
    - "Europe"
  block:
    - "USA"
    - "United States"
    - "Canada"
    - "India"
    - "APAC"

search_queries:
  - name: "LinkedIn QA Automation"
    query: '"Senior QA" OR "Test Automation Engineer" OR SDET remote OR relocation Europe site:linkedin.com/jobs'
    enabled: true
  - name: "Turkey QA Automation"
    query: '"QA Automation Engineer" OR "Test Automation Engineer" OR SDET Turkey OR Türkiye remote'
    enabled: true
  - name: "Greenhouse QA Roles"
    query: 'site:job-boards.greenhouse.io OR site:boards.greenhouse.io "QA Automation" OR "SDET" OR "Test Automation Engineer" remote OR relocation OR visa'
    enabled: true
  - name: "Lever QA Roles"
    query: 'site:jobs.lever.co "QA Engineer" OR "SDET" OR "Test Automation Engineer" remote OR relocation'
    enabled: true
  - name: "Ashby QA Roles"
    query: 'site:jobs.ashbyhq.com "QA Automation" OR "Quality Engineer" OR "SDET" remote OR relocation'
    enabled: true
  - name: "General Europe QA Search"
    query: '"Senior Software QA Specialist" OR "Senior Test Automation Engineer" OR SDET Europe relocation OR visa sponsorship'
    enabled: true
  - name: "Germany QA Automation"
    query: '"Senior QA Automation Engineer" OR "Senior Test Automation Engineer" Germany remote OR relocation OR Berlin OR Munich'
    enabled: true
  - name: "Netherlands QA Automation"
    query: '"Senior QA Automation Engineer" OR SDET Netherlands remote OR relocation OR Amsterdam'
    enabled: true
  - name: "UK QA Automation"
    query: '"Senior Test Automation Engineer" OR "Senior QA Engineer" "United Kingdom" remote OR visa sponsorship'
    enabled: true
  - name: "CEE QA Automation"
    query: '"QA Automation Engineer" OR SDET Poland OR Romania OR Czechia remote OR relocation senior'
    enabled: true
  - name: "Nordics QA Automation"
    query: '"Senior QA Automation Engineer" OR SDET Sweden OR Denmark relocation OR visa'
    enabled: true
  - name: "Ireland QA Automation"
    query: '"Senior Test Automation Engineer" OR "Senior QA Engineer" Ireland remote OR relocation OR sponsorship'
    enabled: true

